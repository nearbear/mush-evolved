# Install, typecheck, lint, test, and build on every push to main (issue #120).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main makes an older, still-running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same Node as the dev environment. Its npm 11 honours the root
      # package.json `allowScripts` approvals (esbuild, workerd) during `npm ci`.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # tools/tests/lobby launches headless Chromium through Playwright.
      - name: Playwright version
        id: pw
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          echo "version=$(node -p "require(require.resolve('playwright/package.json', { paths: ['tools'] })).version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        if: ${{ !cancelled() && steps.pw.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The browser download is cached; the OS libraries it needs are not
      # (they live outside the cache path), so they are installed every run.
      - name: Install Chromium
        if: ${{ !cancelled() && steps.pw.outcome == 'success' && steps.pw-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium OS libraries
        if: ${{ !cancelled() && steps.pw.outcome == 'success' && steps.pw-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium

      # The checks below run even when an earlier one fails, so a single run
      # reports every problem. They are skipped only if the install failed.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --reporter=github

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
