# Install, typecheck, lint, test, and build on every push to main (issue #120).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main makes an older, still-running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same Node as the dev environment. Its npm 11 honours the root
      # package.json `allowScripts` approvals (esbuild, workerd) during `npm ci`.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # The checks below run even when an earlier one fails, so a single run
      # reports every problem. They are skipped only if the install failed.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --reporter=github

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
