# Install, typecheck, lint, test, and build on every push to main (issue #120),
# and, when run by hand with "Deploy to test" ticked, deploy main to the test
# environment if they all passed (issue #121).
name: CI

on:
  push:
    branches: [main]
  # Actions tab > CI > Run workflow, or `gh workflow run CI -f deploy_test=true`.
  workflow_dispatch:
    inputs:
      deploy_test:
        description: Deploy to test if the checks pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer push to main makes an older, still-running check moot. This is
    # per job, not per workflow, so it never cancels a running deploy, and the
    # group includes the event, so a push never cancels a manual run's check
    # (which would skip the deploy it was started for).
    concurrency:
      group: ci-check-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      # Same Node as the dev environment. Its npm 11 honours the root
      # package.json `allowScripts` approvals (esbuild, workerd) during `npm ci`.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # tools/tests/lobby launches headless Chromium through Playwright.
      - name: Playwright version
        id: pw
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          echo "version=$(node -p "require(require.resolve('playwright/package.json', { paths: ['tools'] })).version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        if: ${{ !cancelled() && steps.pw.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The browser download is cached; the OS libraries it needs are not
      # (they live outside the cache path), so they are installed every run.
      - name: Install Chromium
        if: ${{ !cancelled() && steps.pw.outcome == 'success' && steps.pw-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium OS libraries
        if: ${{ !cancelled() && steps.pw.outcome == 'success' && steps.pw-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium

      # The checks below run even when an earlier one fails, so a single run
      # reports every problem. They are skipped only if the install failed.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --reporter=github

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # The long random-game replay checks on five seeds, every seat at every
      # step (#382); `npm test` above skips the rebuild and perspective checks and
      # runs the rest on one seed. About 2 minutes.
      - name: Slow tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:slow

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # Migration files are append-only (#282): no commit in main's history may
      # modify, rename or delete a file in server/migrations/, since D1 records
      # applied migrations by name and won't rerun an edited file. Checking the
      # whole history, not just this push, also catches commits whose own run
      # was cancelled by a newer push. Fetches commits and trees, not file
      # contents, which the check doesn't need.
      - name: Migrations are append-only
        if: ${{ !cancelled() }}
        run: |
          git fetch --unshallow --filter=blob:none --no-tags origin
          changed=$(git log --format='%h %s' --name-status --no-renames --diff-filter=a HEAD -- server/migrations/)
          if [ -n "$changed" ]; then
            echo "::error::Migration files are append-only. Add a new migration instead of changing an existing one:"
            echo "$changed"
            exit 1
          fi

  # Deploys to the test Worker (mush2-server-test, behind Cloudflare Access),
  # only from a manual run with deploy_test ticked and only once every check
  # above passed. Not on every push: a deploy restarts every game room, and a
  # STATE_VERSION bump ends every running game, so it would cut testers off at
  # moments nobody chose. Production and staging stay local
  # (`npm run deploy:production` / `deploy:staging`).
  #
  # Needs two secrets on the `test` GitHub environment: CLOUDFLARE_API_TOKEN
  # (Account > Workers Scripts: Edit and D1: Edit) and CLOUDFLARE_ACCOUNT_ID.
  # See docs/ops/deploy.md.
  deploy-test:
    needs: check
    # Only main in this repo: not another branch, not a fork.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_test && github.ref == 'refs/heads/main' && github.repository == 'nearbear/mush2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: test
      url: https://mush2-server-test.nearbearnearbear.workers.dev
    # One deploy at a time, never cancelled midway (migrations run before the
    # Worker is uploaded). A newer deploy waiting here replaces an older
    # waiting one.
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID on the 'test' environment (docs/ops/deploy.md)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        run: npm ci

      # The same script as a manual deploy: build web, apply the test D1
      # migrations (no confirmation prompt without a terminal; a game-version
      # change stops here unless ALLOW_VERSION_CHANGE=test), then
      # `wrangler deploy --env test` with RULES_VERSION set to the commit hash.
      - name: Deploy to test
        run: npm run deploy:test
